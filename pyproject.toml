[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-level-optimization"
version = "0.1.0"
description = "Reproducible labs for operator-level optimization (ALS-exact, deep linear, FGLN, toy-2d)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "torch>=2.0",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "torchvision>=0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
