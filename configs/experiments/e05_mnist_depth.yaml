# Does the story survive real data?
#
# Bias-free MLPs 784 -> [width]^L -> 10. The 784-wide input layer is far beyond any exact
# per-sample solve, so ALS delegates it to Adam and solves the square stack exactly; the
# split is recorded in every run's meta.json rather than hidden inside the method.
#
#   python -m olo.run configs/experiments/e05_mnist_depth.yaml \
#     --sweep model.depth=2,4,8,16,32 \
#     --sweep optim.type=als,adam,heavyball,muon,kfac,shampoo,soap \
#     --sweep optim.lr=0.1,0.03,0.01,0.003,0.001,0.0003,0.0001 --seeds 0,1,2
#
# Swap `model.type` between crelu_mlp/looks_linear and relu_mlp/xavier to ask the same
# question the synthetic depth wall asks, on data that was not generated by an operator.
# float32 here: the exact solve's dtype promotion is handled inside the solver, and the
# dataset makes float64 throughout needlessly slow.
name: e05_mnist_depth
seed: 0
device: auto
dtype: float32

model:
  type: crelu_mlp
  width: 32
  depth: 8
  init: looks_linear

task:
  type: mnist
  batch_size: 128
  n_train: 10000
  n_eval: 2000

optim:
  type: als
  lr: 0.01
  als:
    lam: 1.0e-3
    n_sweeps: 1
    target: gradient
    layers: auto                       # square stack exactly; wide layers to `outer`
    outer: {type: adam, lr: 1.0e-3}
  kfac: {damping: 1.0e-2}
  shampoo: {beta: 0.9, eps: 1.0e-4}
  soap: {shampoo_beta: 0.95}
  muon: {momentum: 0.95}
  heavyball: {momentum: 0.9}

train:
  steps: 2000
  eval_every: 100
  stop_above: 1.0e4

diagnostics:
  every: 250
  mismatch: true
  conditioning: true
  spectrum: true
  cost: true
